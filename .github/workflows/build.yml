name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip and build
        run: |
          for f in *.zip; do unzip -o "$f" -d project; done
          DIR=$(dirname "$(find project -name 'settings.gradle*' | head -n1)")
          cd "$DIR"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/build/outputs/apk/debug/*.apk
